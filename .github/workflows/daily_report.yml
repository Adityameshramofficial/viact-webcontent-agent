name: Daily Automation Report Email

on:
  schedule:
    - cron: '25 12 * * *'   # Every day at 12:25 UTC = 5:55 PM IST
  workflow_dispatch:
    inputs:
      approved:
        description: "Send to Gary & Surendra? Type 'yes' to approve and send."
        required: false
        default: 'no'

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Daily Report Email
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVED: ${{ github.event.inputs.approved || 'no' }}
        run: python daily_report_script.py
